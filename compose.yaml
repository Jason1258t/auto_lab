# Local services for development. Start: docker compose up -d
# Port 5433, not 5432, so it does not clash with a Postgres on the host.
# Fixed project name: the container and volume names do not depend on
# the folder name.
name: autolab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: autolab
      POSTGRES_PASSWORD: autolab
      POSTGRES_DB: autolab
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the autolab_test database on the first start.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autolab -d autolab"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Log store for full LLM prompts and outputs (LOG_STORE=mongo).
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Web search for the worker (pipeline step "search"), JSON API.
  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  pgdata:
  mongodata:
