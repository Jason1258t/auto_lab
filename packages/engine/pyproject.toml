[project]
name = "autolab-engine"
version = "0.1.0"
description = "AutoLab's pipeline engine: runs a YAML pipeline of small model steps, without a database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    # The code kinds run ruff on generated code (static analysis only).
    "ruff>=0.16.10",
]

[project.scripts]
autolab-engine = "autolab_engine.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
