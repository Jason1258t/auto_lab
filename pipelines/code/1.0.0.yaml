# Pipeline "code", version 1.0.0. Rules: drafts/pipeline_spec.md.
# Never change this file after the worker has synced it: copy it to a
# new version and edit the copy.
#
# One small program (1-2 files). Python files are checked statically
# (syntax, ruff) and fixed once; the code is never run.

pipeline: code
version: 1.0.0
description: >
  One small program in 1-2 files. Python files are checked by static
  analysis and fixed by the model; the code is never run.
evidence: none

steps:
  # 1. What to build, and which files.
  - id: spec
    kind: plan
    llm:
      system: You plan a small program. Reply with JSON only.
      prompt: |
        Task:
        {{ task.input }}

        Plan a small program for this task. Use Python unless the task
        names another language. Use only the standard library unless the
        task asks for a package.
        - "summary": what the program does, in 1-2 sentences;
        - "files": 1 file, or 2 if really needed. For each file a
          relative path (for example "main.py") and its purpose in one
          sentence.
      output:
        type: object
        required: [summary, files]
        additionalProperties: false
        properties:
          summary: { type: string, maxLength: 400 }
          files:
            type: array
            minItems: 1
            maxItems: 2
            items:
              type: object
              required: [path, purpose]
              additionalProperties: false
              properties:
                path: { type: string, minLength: 3, maxLength: 60 }
                purpose: { type: string, maxLength: 200 }
      max_tokens: 300
    summary: "{{ output.files | length }} files planned"

  # 2. One call per file.
  - id: write
    kind: code_write
    for_each: spec.files
    llm:
      system: You write complete, working source files. Reply with JSON only.
      prompt: |
        Task:
        {{ task.input }}

        The program: {{ steps.spec.summary }}
        All files:
        {% for f in steps.spec.files %}
        - {{ f.path }}: {{ f.purpose }}
        {% endfor %}

        Write the complete file "{{ item.path }}" ({{ item.purpose }}).
        Clear names, short functions, comments only where they help.
        Put only the file content in "code", without ``` marks.
      output:
        type: object
        required: [code]
        additionalProperties: false
        properties:
          code: { type: string, minLength: 1, maxLength: 12000 }
      temperature: 0.2
      max_tokens: 2500
    summary: "{{ output.files | length }} files written"

  # 3. Static checks, one fix round, checks again.
  - id: check
    kind: code_check
    from: write.files
    summary: "{{ output.problems }} problems found"

  - id: fix
    kind: code_fix
    for_each: check.files
    llm: &fix
      system: You fix problems in a source file. Reply with JSON only.
      prompt: |
        File "{{ item.path }}" ({{ item.purpose }}):

        {{ item.code }}

        A static checker found these problems:
        {% for p in item.problems %}
        - {{ p }}
        {% endfor %}

        Return the complete fixed file. Change only what is needed.
        Put only the file content in "code", without ``` marks.
      output:
        type: object
        required: [code]
        additionalProperties: false
        properties:
          code: { type: string, minLength: 1, maxLength: 12000 }
      temperature: 0.1
      max_tokens: 2500
    summary: "{{ output.fixed }} files fixed"

  - id: check2
    kind: code_check
    from: fix.files
    summary: "{{ output.problems }} problems left"

  # 4. How to run it.
  - id: usage
    kind: plan
    llm:
      system: You write short usage notes. Reply with JSON only.
      prompt: |
        Task:
        {{ task.input }}

        The program: {{ steps.spec.summary }}
        Files:
        {% for f in steps.check2.files %}
        - {{ f.path }}: {{ f.purpose }}
        {% endfor %}

        Write short usage notes in Markdown: how to run the program, with
        one or two example commands and what they print.
      output:
        type: object
        required: [usage]
        additionalProperties: false
        properties:
          usage: { type: string, maxLength: 2000 }
      max_tokens: 500
    summary: "usage notes written"

revise:
  rerun_from: write
  note: |
    A reviewer rejected the previous version. Fix this: {{ review.comment }}
